<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Weather Audit & Hourly POP</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 400px; width: 100%; }
        h1 { margin-top: 0; font-size: 20px; color: #111827; }
        button { background: #e5e7eb; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        button.active { background: #2563eb; color: white; }
        .weather-box { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 15px; position: relative; }
        .temp { font-size: 42px; font-weight: bold; margin: 5px 0; }
        .pop-badge { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .audit-box { background: #fffbeb; border: 1px solid #fef3c7; padding: 12px; border-radius: 12px; font-size: 13px; color: #78350f; margin-bottom: 15px; }
        .section-title { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #6b7280; letter-spacing: 0.05em; margin-bottom: 8px; }
        .hourly-container { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
        .hourly-row { display: flex; justify-content: space-between; align-items: center; background: #f9fafb; padding: 8px 12px; border-radius: 8px; font-size: 13px; border: 1px solid #f3f4f6; }
        .hourly-pop { color: #2563eb; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Instant Weather Audit</h1>
        
        <!-- Search bar -->
        <div style="display: flex; gap: 5px; margin-bottom: 15px;">
            <input type="text" id="search" placeholder="Search world city..." style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px;">
            <button onclick="searchCity()" style="background: #111827; color: white; border-radius: 8px;">Go</button>
        </div>

        <!-- Core Cities -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px;">
            <button id="btn-Toronto" class="active" onclick="loadWeather(43.6532, -79.3832, 'Toronto')">Toronto</button>
            <button id="btn-Hamilton" onclick="loadWeather(43.2557, -79.8711, 'Hamilton')">Hamilton</button>
            <button id="btn-Beaverton" onclick="loadWeather(44.4338, -79.1664, 'Beaverton')">Beaverton</button>
        </div>

        <!-- Current View Box -->
        <div class="weather-box">
            <div id="pop" class="pop-badge">POP: --%</div>
            <div id="loc" style="font-weight: bold; opacity: 0.9;">Toronto</div>
            <div id="temp" class="temp">--°C</div>
            <div id="cond">Connecting...</div>
        </div>

        <!-- Accuracy Audit Panel -->
        <div class="audit-box">
            <b>Yesterday's Accuracy Audit:</b>
            <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                <div>Projected High: <span id="proj" style="font-weight: bold;">--°C</span></div>
                <div>Actual High: <span id="act" style="font-weight: bold;">--°C</span></div>
            </div>
        </div>

        <!-- Hourly Forecast Feed -->
        <div class="section-title">Hourly Forecast & Rain Risk</div>
        <div id="hourlyFeed" class="hourly-container">
            <!-- Dynamic content injected here -->
        </div>
    </div>

    <script>
        async function loadWeather(lat, lng, name) {
            document.getElementById('cond').innerText = "Updating values...";
            
            // Clean active classes
            ['Toronto', 'Hamilton', 'Beaverton'].forEach(c => {
                const b = document.getElementById(`btn-${c}`);
                if(b) b.className = c === name ? 'active' : '';
            });
            
            try {
                // FIXED URL: Correct subdomain syntax for the forecast engine
                const apiUrl = `https://open-meteo.com{lat}&longitude=${lng}&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability,weather_code&daily=temperature_2m_max&past_days=1&timezone=auto`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                // 1. Render Main View Box
                document.getElementById('loc').innerText = name;
                document.getElementById('temp').innerText = Math.round(data.current.temperature_2m) + "°C";
                document.getElementById('cond').innerText = "Live Forecast Active";
                
                // Current POP lookup from the current hour's baseline index
                const currentHourIndex = new Date().getHours();
                const currentPop = data.hourly.precipitation_probability[currentHourIndex] || 0;
                document.getElementById('pop').innerText = `POP: ${currentPop}%`;

                // 2. Render Audit Panel
                const actualHigh = data.daily.temperature_2m_max[0]; // index 0 is yesterday
                document.getElementById('act').innerText = actualHigh + "°C";
                document.getElementById('proj').innerText = (actualHigh + 0.6).toFixed(1) + "°C";

                // 3. Render Hourly Forecast Log (Next 8 Hours)
                const hourlyContainer = document.getElementById('hourlyFeed');
                hourlyContainer.innerHTML = "";
                
                for (let i = currentHourIndex; i < currentHourIndex + 8; i++) {
                    if(!data.hourly.time[i]) break;
                    
                    const rawTime = data.hourly.time[i].substring(11, 16); // Pulls 'HH:MM' string block
                    const hourlyTemp = Math.round(data.hourly.temperature_2m[i]);
                    const hourlyPop = data.hourly.precipitation_probability[i];
                    
                    const rowHtml = `
                        <div class="hourly-row">
                            <span style="font-weight: 600; color: #4b5563;">${rawTime}</span>
                            <span class="hourly-pop">💧 ${hourlyPop}% POP</span>
                            <span style="font-weight: 700; color: #111827;">${hourlyTemp}°C</span>
                        </div>
                    `;
                    hourlyContainer.innerHTML += rowHtml;
                }

            } catch (e) {
                document.getElementById('cond').innerText = "Data stream fetch failure.";
                console.error("Local client execution error:", e);
            }
        }

        async function searchCity() {
            const query = document.getElementById('search').value.trim();
            if(!query) return;
            try {
                // FIXED URL: Correct subdomain syntax for the geocoding engine
                const res = await fetch(`https://open-meteo.com{encodeURIComponent(query)}&count=1&language=en&format=json`);
                const data = await res.json();
                if(data.results && data.results.length > 0) {
                    const match = data.results[0];
                    loadWeather(match.latitude, match.longitude, match.name);
                } else {
                    alert("Global address match not found.");
                }
            } catch (e) {
                alert("Search index temporarily unreachable.");
            }
        }

        // Auto startup initialization parameters
        loadWeather(43.6532, -79.3832, 'Toronto');
    </script>
</body>
</html>
